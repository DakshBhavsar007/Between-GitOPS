name: Docker CI & GHCR Publishing

on:
  push:
    branches: [ main, feature/lovable-ui-refresh ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Quality Gate: Linting, Compilation & Tests
  # ==========================================
  validate-and-test:
    name: Validate & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vishleshan
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vishleshan
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret-key-for-validation-only-never-in-production
      JWT_ALGORITHM: HS256
      DEBUG: "True"
      GEMINI_API_KEY: ci-dummy-key-not-a-real-secret
      ADMIN_EMAIL: admin@between.com
      ADMIN_PASSWORD: Admin@007Password!
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Frontend Quality Checks
      # ------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Create Frontend CI Env
        run: |
          cd frontend
          echo "VITE_API_URL=/api/v1" > .env.local

      - name: Build Frontend Assets
        run: |
          cd frontend
          npm run build

      # ------------------------------------------
      # Backend Quality Checks & Unit Tests
      # ------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt

      - name: Validate Python Syntax & Compilation
        run: |
          python -m compileall backend/

      - name: Run Django Migrations
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run Backend Tests
        run: |
          cd backend
          python manage.py test tests.test_admin tests.test_dynamic_configs tests.test_twofactor --noinput
          python tests/test_ml_accuracy.py

  # ==========================================
  # Docker Build & GHCR Publication
  # ==========================================
  build-and-push:
    name: Build & Publish Containers to GHCR
    needs: validate-and-test
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ github.sha }}
      backend_image: ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-backend:${{ github.sha }}
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_image: ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-frontend:${{ github.sha }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Owner Name
        id: repo_owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "OWNER=${OWNER}" >> $GITHUB_OUTPUT

      - name: Determine Publishing Mode
        id: push_decision
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ([ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/feature/lovable-ui-refresh" ]); then
            echo "SHOULD_PUSH=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHOULD_PUSH=true" >> $GITHUB_OUTPUT
          else
            echo "SHOULD_PUSH=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry (GHCR)
        if: steps.push_decision.outputs.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------
      # Backend Image (Shared by Backend & Celery)
      # ------------------------------------------
      - name: Build & Publish Backend Image
        id: build_backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.push_decision.outputs.SHOULD_PUSH == 'true' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------
      # Frontend Image (NGINX SPA)
      # ------------------------------------------
      - name: Build & Publish Frontend Image
        id: build_frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.push_decision.outputs.SHOULD_PUSH == 'true' }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------
      # GitOps Image Reference Output
      # ------------------------------------------
      - name: Display GitOps Image Manifest Handoff
        run: |
          echo "=========================================================="
          echo "         GITOPS HANDOFF: IMMUTABLE IMAGE METADATA         "
          echo "=========================================================="
          echo "Commit SHA:       ${{ github.sha }}"
          echo "Backend Image:    ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-backend:${{ github.sha }}"
          echo "Backend Digest:   ${{ steps.build_backend.outputs.digest }}"
          echo "Frontend Image:   ghcr.io/${{ steps.repo_owner.outputs.OWNER }}/between-frontend:${{ github.sha }}"
          echo "Frontend Digest:  ${{ steps.build_frontend.outputs.digest }}"
          echo "=========================================================="
          echo "Ready for GitOps Manifest Update in downstream repo"
