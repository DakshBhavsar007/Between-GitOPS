apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: between-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: between
    app.kubernetes.io/part-of: between-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # GitOps manifests repository
    repoURL: https://github.com/DakshBhavsar007/Between-GitOPS.git
    targetRevision: main
    path: gitops-manifests/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: between
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: between-secrets
      jsonPointers:
        - /data
        - /stringData
  syncPolicy:
    automated:
      prune: true      # Automatically delete resources removed from Git
      selfHeal: true   # Automatically revert out-of-band drifts
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
