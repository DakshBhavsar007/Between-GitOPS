apiVersion: v1
kind: Secret
metadata:
  name: between-secrets
  namespace: between
  labels:
    app.kubernetes.io/name: between
    app.kubernetes.io/part-of: between-gitops
type: Opaque
stringData:
  # In production, replace with your real AWS RDS PostgreSQL connection URL:
  # Format: postgresql://<user>:<password>@<rds-endpoint>:5432/<dbname>
  DATABASE_URL: "postgresql://postgres:REPLACE_ME_POSTGRES_PASSWORD@between-rds.placeholder.us-east-1.rds.amazonaws.com:5432/vishleshan"
  # Internal Redis ClusterIP Service URL
  REDIS_URL: "redis://between-redis:6379/1"
  # JWT Signing Secret (generate via: openssl rand -hex 32)
  JWT_SECRET: "REPLACE_ME_JWT_SECRET_KEY_MINIMUM_32_CHARACTERS"
  # AI Provider API Key
  GEMINI_API_KEY: "REPLACE_ME_GEMINI_API_KEY"
  # 2Factor SMS Gateway Key
  TWOFACTOR_API_KEY: "REPLACE_ME_TWOFACTOR_API_KEY"
  # Initial Admin Credentials
  ADMIN_EMAIL: "admin@between.com"
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
