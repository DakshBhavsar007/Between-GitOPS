apiVersion: apps/v1
kind: Deployment
metadata:
  name: between-backend
  namespace: between
  labels:
    app: between-backend
    app.kubernetes.io/name: between
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: between-backend
  template:
    metadata:
      labels:
        app: between-backend
        app.kubernetes.io/name: between
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/dakshbhavsar007/between-backend:placeholder
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /app/entrypoint.sh
            - gunicorn
            - vishleshan_backend.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "1"
            - --timeout
            - "120"
            - --access-logfile
            - "-"
            - --error-logfile
            - "-"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: between-config
            - secretRef:
                name: between-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
            - name: photos-volume
              mountPath: /app/photos
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: between-uploads-pvc
        - name: photos-volume
          persistentVolumeClaim:
            claimName: between-uploads-pvc
