apiVersion: apps/v1
kind: Deployment
metadata:
  name: between-frontend
  namespace: between
  labels:
    app: between-frontend
    app.kubernetes.io/name: between
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: between-frontend
  template:
    metadata:
      labels:
        app: between-frontend
        app.kubernetes.io/name: between
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dakshbhavsar007/between-frontend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - for f in /usr/share/nginx/html/assets/*.js; do sed -i 's/client_id=undefined/client_id=Ov23liZTawFuQJbU3Q1J/g' "$f" 2>/dev/null || true; done
