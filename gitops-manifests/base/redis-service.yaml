apiVersion: v1
kind: Service
metadata:
  name: between-redis
  namespace: between
  labels:
    app: between-redis
    app.kubernetes.io/name: between
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
      protocol: TCP
  selector:
    app: between-redis
